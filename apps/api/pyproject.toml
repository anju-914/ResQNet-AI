[project]
name = "resqnet-api"
version = "0.1.0"
description = "ResQNet AI: Emergency SOS Ingestion, Verification & Graph-based Routing Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
    "networkx>=3.4.0",
    "torch>=2.5.0",
    "torch-geometric>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

